<style>
    body {
        background-image: url('img/Wii_u/fondowii_u.webp');
        background-position: center;
        color: #000000;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: bold;
        margin: 0;
        padding: 0;
    }

    /* Estilo para el borde al seleccionar una figura */
    @keyframes glow {
        0% {
            box-shadow: 0 0 10px rgb(255, 111, 0), 0 0 20px rgb(255, 111, 0), 0 0 30px rgb(255, 111, 0), 0 0 40px rgb(255, 111, 0);
        }

        50% {
            box-shadow: 0 0 20px rgb(255, 111, 0), 0 0 30px rgb(255, 111, 0), 0 0 40px rgb(255, 111, 0), 0 0 50px rgb(255, 111, 0);
        }

        100% {
            box-shadow: 0 0 10px rgb(255, 111, 0), 0 0 20px rgb(255, 111, 0), 0 0 30px rgb(255, 111, 0), 0 0 40px rgb(255, 111, 0);
        }
    }

    .selected {
        border: 18px solid rgb(255, 111, 0);
        animation: glow 1.5s infinite alternate;
    }

    /* Posicionamiento del cuadro de suma */
    #total-suma {
        position: fixed;
        top: 8px;
        right: 10px;
        background-color: white;
        border: 8px solid rgb(255, 111, 0);
        padding: 20px;
        font-size: 2.3em;
        font-weight: bold;
    }

    #mostrar-selecciones {
        position: fixed;
        top: 5px;
        left: 5px;
        background-color: rgb(255, 111, 0);
        color: white;
        border: none;
        padding: 35px 35px;
        font-size: 2em;
        font-weight: bold;
        cursor: pointer;
        border-radius: 10px;
    }

    #mostrar-selecciones:hover {
        background-color: rgb(255, 111, 0);
    }

    #cuadro-selecciones {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 800px;
        background-color: white;
        border: 5px solid rgb(255, 111, 0);
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        padding: 20px;
        display: none;
        z-index: 1000;
        cursor: default;
    }

    #contenedor-imagenes {
        display: flex;
        justify-content: center;
        gap: 10px;
        overflow-x: auto;
        padding: 110px;
    }

    #contenedor-imagenes img {
        max-width: 150px;
        height: auto;
        cursor: pointer;
    }

    #cuadro-selecciones h2 {
        text-align: center;
        color: rgb(0, 0, 0);
        margin-bottom: 10px;
    }

    /* Mostrar 2 por fila */
    #cuadro-selecciones .item {
        width: 48%;
        display: inline-block;
        vertical-align: top;
        text-align: center;
        margin: 1%;
        border: 2px solid rgb(255, 111, 0);
        border-radius: 10px;
        padding: 10px;
        box-sizing: border-box;
    }

    /* Imagen rellena el espacio completamente */
    #cuadro-selecciones .item img {
        width: 100%;
        height: 370px;
        object-fit: fill;
        border-radius: 5px;
    }

    /* Botones */
    #cuadro-selecciones button {
        background-color: rgb(255, 111, 0);
        color: rgb(0, 0, 0);
        border: none;
        padding: 33px 30px;
        font-size: 1.6em;
        font-weight: bold;
        cursor: pointer;
        border-radius: 10px;
    }

    #cuadro-selecciones button:hover {
        background-color: rgb(255, 111, 0);
    }

    #cerrar-cuadro:hover {
        background-color: rgb(255, 111, 0);
    }

    .abecedario {
        text-align: center;
        margin: 120px 0;
        background-color: black;
        /* fondo negro */
        padding: 20px;
    }

    .abecedario a {
        color: rgb(255, 111, 0);
        /* naranja */
        margin: 0 10px;
        text-decoration: none;
        font-size: 30px;
        font-weight: bold;
    }

    /* opcional: efecto al pasar el mouse */
    .abecedario a:hover {
        color: white;
    }

    /* Estilo para impresión */
    @media print {
        body * {
            display: none;
        }

        #cuadro-selecciones,
        #cuadro-selecciones * {
            display: block;
        }

        #cuadro-selecciones {
            position: static !important;
            transform: none !important;
            border: none !important;
            box-shadow: none !important;
            width: 100% !important;
        }
    }

    @media screen and (max-width: 768px) {
        .special-caption {
            font-size: 12px;
        }
    }
</style>

                        const totalSeleccionado = document.getElementById('total-seleccionado');
                        const cerrarCuadro = document.getElementById('cerrar-cuadro');

                        function updateTotal() {
                            totalSuma.textContent = `Total: ${totalGB.toFixed(2)} GB`;
                            totalSeleccionado.textContent = totalGB.toFixed(2);
                        }

                        figures.forEach((figure) => {
                            figure.addEventListener('click', function () {
                                const captionText = this.querySelector('.special-caption').textContent;
                                let valueGB = 0;
                                if (captionText.includes('_GB')) {
                                    valueGB = parseFloat(captionText.replace('_GB', ''));
                                } else if (captionText.includes('_MB')) {
                                    valueGB = parseFloat(captionText.replace('_MB', '')) / 1024;
                                }

                                if (this.classList.contains('selected')) {
                                    this.classList.remove('selected');
                                    totalGB -= valueGB;
                                } else {
                                    this.classList.add('selected');
                                    totalGB += valueGB;
                                }

                                updateTotal();
                            });
                        });

                        mostrarSelecciones.addEventListener('click', () => {
                            listaSelecciones.innerHTML = '';
                            const selectedFigures = document.querySelectorAll('.figure-item.selected');
                            selectedFigures.forEach((figure) => {
                                const captionText = figure.querySelector('.special-caption').textContent;
                                const imageSrc = figure.querySelector('img').src;

                                const itemDiv = document.createElement('div');
                                itemDiv.classList.add('item');

                                const imgElement = document.createElement('img');
                                imgElement.src = imageSrc;

                                const captionElement = document.createElement('span');
                                captionElement.textContent = captionText;

                                const closeButton = document.createElement('button');
                                closeButton.textContent = 'X';
                                closeButton.classList.add('remove-btn');
                                closeButton.addEventListener('click', () => {
                                    if (confirm(`¿Deseas eliminar ${captionText}?`)) {
                                        figure.classList.remove('selected');
                                        let valueGB = 0;
                                        if (captionText.includes('_GB')) {
                                            valueGB = parseFloat(captionText.replace('_GB', ''));
                                        } else if (captionText.includes('_MB')) {
                                            valueGB = parseFloat(captionText.replace('_MB', '')) / 1024;
                                        }
                                        totalGB -= valueGB;
                                        updateTotal();
                                        itemDiv.remove();
                                    }
                                });

                                itemDiv.appendChild(imgElement);
                                itemDiv.appendChild(captionElement);
                                itemDiv.appendChild(closeButton);

                                listaSelecciones.appendChild(itemDiv);
                            });

                            updateTotal();
                            cuadroSelecciones.style.display = 'block';
                        });

                        cerrarCuadro.addEventListener('click', () => {
                            cuadroSelecciones.style.display = 'none';
                        });
                    </script>

                    <script>
                        const cuadro = document.getElementById('cuadro-selecciones');
                        let isDragging = false;
                        let offsetX = 0, offsetY = 0;

                        // Asegurar que el cuadro tenga `position: absolute`
                        cuadro.style.position = "block";

                        // Evitar el desplazamiento de la página al mover el cuadro en móviles
                        function disableScroll(e) {
                            e.preventDefault();
                        }

                        // Evento para empezar a arrastrar con el mouse
                        cuadro.addEventListener('mousedown', (e) => {
                            isDragging = true;
                            offsetX = e.clientX - cuadro.offsetLeft;
                            offsetY = e.clientY - cuadro.offsetTop;
                            cuadro.style.cursor = "grabbing";
                        });

                        // Evento para mover el cuadro con el mouse
                        document.addEventListener('mousemove', (e) => {
                            if (isDragging) {
                                cuadro.style.left = `${e.clientX - offsetX}px`;
                                cuadro.style.top = `${e.clientY - offsetY}px`;
                            }
                        });

                        // Evento para soltar el cuadro con el mouse
                        document.addEventListener('mouseup', () => {
                            isDragging = false;
                            cuadro.style.cursor = "grab";
                        });

                        // Evento para empezar a arrastrar con el tacto (evita scroll)
                        cuadro.addEventListener('touchstart', (e) => {
                            const touch = e.touches[0];
                            isDragging = true;
                            offsetX = touch.clientX - cuadro.offsetLeft;
                            offsetY = touch.clientY - cuadro.offsetTop;
                            cuadro.style.cursor = "grabbing";

                            // Evitar que la página se desplace
                            document.body.addEventListener('touchmove', disableScroll, { passive: false });
                        });

                        // Evento para mover el cuadro con el tacto
                        document.addEventListener('touchmove', (e) => {
                            if (isDragging) {
                                const touch = e.touches[0];
                                cuadro.style.left = `${touch.clientX - offsetX}px`;
                                cuadro.style.top = `${touch.clientY - offsetY}px`;
                            }
                        });

                        // Evento para soltar el cuadro con el tacto (reactivar scroll)
                        document.addEventListener('touchend', () => {
                            isDragging = false;
                            cuadro.style.cursor = "grab";

                            // Permitir que la página se desplace nuevamente
                            document.body.removeEventListener('touchmove', disableScroll);
                        });

                    </script>

                    <script>
                        document.addEventListener("DOMContentLoaded", () => {
                            const links = document.querySelectorAll(".abecedario a");
                            const sections = document.querySelectorAll(".game-section");

                            // 🔹 Mostrar solo la sección (#) al inicio
                            sections.forEach(section => {
                                section.style.display = section.id === "section-(#)" ? "block" : "none";
                            });

                            links.forEach(link => {
                                link.addEventListener("click", e => {
                                    e.preventDefault();
                                    const targetId = link.getAttribute("href").substring(1);
                                    const target = document.getElementById(targetId);

                                    if (!target) return;

                                    // 🔹 Evitar que (#) desaparezca al hacer clic otra vez
                                    if (targetId === "section-(#)") {
                                        sections.forEach(section => {
                                            section.style.display = section.id === "section-(#)" ? "block" : "none";
                                        });
                                        return;
                                    }

                                    // Ocultar todas las secciones
                                    sections.forEach(section => section.style.display = "none");

                                    // Mostrar la sección seleccionada y sus padres
                                    let current = target;
                                    while (current && current.classList.contains("game-section")) {
                                        current.style.display = "block";
                                        current = current.parentElement.closest(".game-section");
                                    }

                                    // Desplazamiento suave hacia la sección elegida
                                    target.scrollIntoView({ behavior: "smooth" });
                                });
                            });
                        });
                    </script>
