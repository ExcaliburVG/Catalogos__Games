<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>Elección De Juegos PS3</title>
  <link rel="stylesheet" href="Estilos_games.css">
  <style>
    /* Estilos para centrar la página */
    body,
    html {
      background-image: url('img/ps3/fondops3.webp');
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #333;
      font-family: Arial, sans-serif;
    }

    /* Estilos del contenedor */
    .button-container {
      display: flex;
      gap: 20px;
    }

    /* Estilos de los botones */
    .rgb-button {
      padding: 90px 90px;
      border: 5px solid transparent;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      position: relative;
      text-decoration: none;
      overflow: hidden;
      transition: color 0.3s ease;
      z-index: 1;
    }

    /* Efecto de iluminación RGB */
    .rgb-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(45deg, rgb(255, 255, 255), green, blue, rgb(255, 0, 0), rgb(0, 255, 247));
      z-index: -1;
      filter: blur(8px);
      opacity: 0.8;
      transition: opacity 0.3s ease;
      border-radius: 10px;
      animation: rgb-effect 3s linear infinite;
    }

    /* Efecto de hover */
    .rgb-button:hover::before {
      filter: blur(12px);
      opacity: 1;
    }

    /* Animación RGB */
    @keyframes rgb-effect {
      0% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-50%, -50%);
      }

      100% {
        transform: translate(0, 0);
      }
    }


    .rgb-button {
      display: block;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      padding: 25px 20px;
      border-radius: 200px;
      font-size: 20px;
      transition: background-color 0.3s ease;
    }

    .rgb-button:hover {
      background-color: #0056b3;
    }

  </style>
</head>


<div class="button-container">
  <a href="ps3.html" class="rgb-button">Juegos Injectados💉</a>
</div>

<div class="button-container">
  <a href="#" class="rgb-button">Juegos [HEN]🟠</a>
</div>

<div class="button-container">
  <a href="#" class="rgb-button">Convert PS2---PS3</a>
</div>

<button class="volver-btn" onclick="window.location.href='index.html'">❌</button>
</body>

</html>
